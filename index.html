<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Wishlist 20/10 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF5F7;--bg2:#FFD1DC;--glass:rgba(255,255,255,.72);--pink:#FF69B4;--rose:#B76E79;--tx:#4A3E3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a1a22;--bg2:#4a2536;--glass:rgba(60,35,48,.75);--tx:#fbe9ef}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Quicksand,system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2));overflow-x:hidden}
h1,h2{font-family:'Dancing Script',cursive;margin:.2em 0}
#app{max-width:980px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:2}
.glass{background:var(--glass);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(183,110,121,.18)}
.step{animation:in .5s ease}@keyframes in{from{opacity:0;transform:translateY(16px)}}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 22px;background:var(--pink);color:#fff;font-weight:700;transition:transform .15s}
button:active{transform:scale(.95)}button:disabled{background:#c9b8bd;cursor:not-allowed}
button.alt{background:#fff;color:var(--rose);border:2px solid var(--rose)}
input,textarea{width:100%;font:inherit;padding:10px 12px;margin-top:8px;border-radius:12px;border:1.5px solid var(--bg2);background:rgba(255,255,255,.9);color:#4A3E3D}
.center{text-align:center}
#env{font-size:110px;cursor:pointer;display:inline-block;margin-top:24px;filter:drop-shadow(0 10px 14px rgba(183,110,121,.4))}
#env.open{animation:pop .8s ease forwards}@keyframes pop{50%{transform:scale(1.25) rotate(-6deg)}}
.beat{animation:beat 1.1s infinite}@keyframes beat{50%{transform:scale(1.12)}}
.chat{max-width:520px;margin:0 auto;position:relative;min-height:280px}
.bubble{background:#fff;color:#4A3E3D;border-radius:18px 18px 18px 4px;padding:12px 16px;display:inline-block;margin-bottom:16px}
.opts{position:relative;height:160px}.opts button{position:absolute;left:0;top:0}
#troll{transition:left .25s,top .25s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{cursor:pointer;text-align:center;border:2px solid transparent;transition:border-color .2s,transform .2s}
.card.sel{border-color:var(--pink);transform:translateY(-4px)}
.card .ic{font-size:54px}.card .extra{text-align:left;margin-top:10px;cursor:default}
.card label{display:block;padding:6px 0}
.shake{animation:sh .5s}@keyframes sh{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.err{color:#c0392b;font-weight:700;margin-top:8px}
.receipt{max-width:440px;margin:0 auto;background:#fffaf5;color:#4A3E3D;border-radius:6px;padding:24px;font-family:'Courier New',monospace;box-shadow:0 12px 30px rgba(0,0,0,.18);border-top:8px dotted var(--pink);animation:drop .7s ease}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.receipt h2{font-size:30px;text-align:center;color:var(--rose)}.receipt p{margin:8px 0;word-break:break-word}.receipt hr{border:0;border-top:2px dashed #e7b9c4}
#music{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:9;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px)}
#music button{padding:4px 8px;background:none;color:var(--rose);font-size:18px}
#disc{font-size:24px;display:inline-block}#disc.on{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--pink);height:4px}.eq.on i{animation:eq .7s infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}@keyframes eq{to{height:16px}}
.fl{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;padding:10px 18px;border-radius:999px;z-index:20;display:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
.spot{max-width:380px;margin:24px auto;min-height:280px}.zoom{animation:zoom .6s ease}@keyframes zoom{from{transform:scale(.4);opacity:0}}.big{font-size:100px}.glow{box-shadow:0 0 45px 12px rgba(255,200,40,.6)}.cap{opacity:.85;margin:6px 0}.quote{font-style:italic;font-size:20px;line-height:1.6;max-width:480px;margin:18px auto}
.pic{width:100%;max-height:150px;object-fit:contain;border-radius:12px}.bigpic{max-width:260px;max-height:230px;width:auto;object-fit:contain;border-radius:14px;transition:filter .3s}.boom{animation:boom .9s cubic-bezier(.2,1.6,.4,1);background:linear-gradient(135deg,#ffe29f,#ff9ecb);box-shadow:0 0 60px 20px rgba(255,105,180,.7);color:#4A3E3D}.boom h3{font-size:34px;color:#c2185b}.boom .big{font-size:130px;animation:beat .5s infinite}@keyframes boom{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.3) rotate(4deg);opacity:1}100%{transform:scale(1)}}
</style></head><body>
<div id="music"><span id="disc">💿</span><div class="eq" id="eq"><i></i><i></i><i></i></div><button id="mute" aria-label="Bật/tắt nhạc">🔇</button></div>
<div id="app"></div><div id="toast"></div>

const API_URL = "/api/wishlist"; // Serverless function ghi vào MongoDB (xem api/wishlist.js)

const $=s=>document.querySelector(s),app=$("#app");

let ac,musicOn=false,musicTimer,muted=false,master;
function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=1;master.connect(ac.destination)}if(ac.state==="suspended")ac.resume();return ac}
function tone(f,t0,d,type="sine",v=.15){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(master);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d)}
const SFX={pop:()=>tone(620,0,.1,"sine",.2),troll:()=>{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(150,a.currentTime);o.frequency.exponentialRampToValueAtTime(700,a.currentTime+.25);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+.4)},
sparkle:()=>[1046,1318,1568,2093].forEach((f,i)=>tone(f,i*.09,.5,"sine",.1)),victory:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,i*.12,.4,"triangle",.14))};
const playSFX=n=>{try{SFX[n]()}catch(e){}};

function startMusic(){if(musicOn)return;musicOn=true;let i=0;const step=()=>{if(!muted)tone(MELODY[i%MELODY.length],0,1.1,"sine",.07);i++;musicTimer=setTimeout(step,520)};step();ui()}
function ui(){const on=musicOn&&!muted;$("#disc").classList.toggle("on",on);$("#eq").classList.toggle("on",on);$("#mute").textContent=on?"🔊":"🔇"}
$("#mute").onclick=()=>{ctx();if(!musicOn)startMusic();else muted=!muted;ui()};

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
function floaters(){setInterval(()=>{const e=document.createElement("div");e.className="fl";e.textContent=["💗","🌸","✨","💖"][Math.random()*4|0];e.style.left=Math.random()*100+"vw";e.style.fontSize=14+Math.random()*18+"px";e.style.animationDuration=7+Math.random()*6+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),13000)},900)}
const go=n=>{S.step=n;render()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){[s1,s2,s3,s4,s5][S.step-1]()}
function s1(){app.innerHTML=`<div class="step center"><h1 style="font-size:46px">Gửi công chúa nhỏ của anh!</h1><p>Có một bất ngờ 20/10 dành riêng cho em...</p><div id="env" class="beat" role="button" tabindex="0" aria-label="Mở thư bí mật">💌</div><p><button id="open">Mở thư bí mật</button></p></div>`;
const open=()=>{playSFX("pop");startMusic();const e=$("#env");e.classList.remove("beat");e.classList.add("open");e.textContent="📨";setTimeout(()=>go(2),1200)};$("#open").onclick=open;$("#env").onclick=open}
function s2(){app.innerHTML=`<div class="step glass chat"><div class="bubble">Trước khi nhận quà, anh muốn hỏi: dạo này em thấy mình có ngoan không?</div>
<div class="opts"><button id="good" style="z-index:2">Ngoan xuất sắc 100/100 🥰</button><button id="troll" class="alt" style="top:80px;left:0">Hong, em hay dỗi lắm 🙈</button></div>
<p class="center"><button id="pass" disabled>Chọn quà thoaiii 🌸</button></p></div>`;
const pass=$("#pass");
$("#good").onclick=()=>{playSFX("sparkle");try{confetti({particleCount:60,spread:70,colors:["#FF69B4","#FFD1DC"],origin:{y:.6}})}catch(e){}toast("Đúng vậy! Công chúa luôn luôn ngoan!");pass.disabled=false};
pass.onclick=()=>{playSFX("pop");go(3)};
const t=$("#troll"),dodge=()=>{if(S.trollDodges>=MAX_DODGE)return;S.trollDodges++;playSFX("troll");
if(S.trollDodges>=MAX_DODGE){t.textContent="Nhưng anh vẫn thương em nhất!";t.style.left="0";t.style.top="80px";pass.disabled=false;toast("Né hết rồi! Bấm Chọn quà thoaiii nhé 💕");return}
const box=t.parentElement,mx=Math.max(0,box.clientWidth-t.offsetWidth),my=Math.max(0,box.clientHeight-t.offsetHeight);t.style.left=Math.random()*mx+"px";t.style.top=Math.random()*my+"px"};
t.onmouseenter=dodge;t.ontouchstart=e=>{if(S.trollDodges<MAX_DODGE){e.preventDefault();dodge()}}}

const ico=(g,c)=>IMG[g.id]?`<img class="${c}" alt="${g.n}" src="${IMG[g.id]}">`:g.i;
const GIFTS=[{id:1,n:"1 chỉ vàng",i:"💰"},{id:2,n:"Túi Xách Thời Trang",i:"👜"},{id:3,n:"Mỹ Phẩm",i:"🧴"},{id:6,n:"Laura Cà phê",i:"☕"},{id:7,n:"iPhone Duo",i:"📱"},{id:5,n:"Quà Tự Chọn / Bất Ngờ",i:"🎁"}];
const TROLL={1:"Lỗi 404: Ví anh chưa đủ dày! Món này nợ lại sau nha 💸",6:"Cuộc đời em chua chát lắm hẻ mà chọn cái này",7:"Hàng này chưa có ngoài thị trường, anh đang tìm nhà cung cấp 📱"};
const CAP={1:"Món hấp dẫn nhất đây rồi...",6:"Nghe quen quen nhỉ?",7:"Hàng độc, có cả CH Play",2:"Chút xinh xắn cho em",3:"Cho làn da thêm rạng rỡ",5:"Và một bất ngờ dành cho em"};
const ORDER=[1,6,7,2,3,5];let timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function extra(id){
if(id===2)return`<input id="f1" placeholder="Tên thương hiệu / Mã túi (VD: Charles & Keith...)" value="${esc(S.f1)}"><input id="f2" placeholder="Link Shopee / Insta (nếu có): https://..." value="${esc(S.f2)}">`;
if(id===3)return`<input id="f1" placeholder="Tên hãng & sản phẩm (VD: Laneige, Innisfree...)" value="${esc(S.f1)}"><input id="f2" placeholder="Link tham khảo" value="${esc(S.f2)}">`;
if(id===5)return`<textarea id="f1" rows="3" placeholder="Điền ước nguyện của em...">${esc(S.f1)}</textarea><input id="f2" placeholder="Dán link (nếu có)" value="${esc(S.f2)}">`;return""}
function intro(){
app.innerHTML=`<div class="step center"><h2 style="font-size:40px">Wishlist của em đây 🌷</h2><div id="stage" class="glass spot"></div><p><button class="alt" id="skip">Bỏ qua</button></p></div>`;
const st=$("#stage");let idx=0,clicked=false,tm;
const done=()=>{clearTimeout(tm);S.introDone=true;s3()};
const view=(id,cls,cap)=>{const g=GIFTS.find(x=>x.id===id);st.className="glass spot "+cls;st.innerHTML=`<div class="big">${ico(g,"bigpic")}</div><h3>${g.n}</h3><p class="cap">${cap||CAP[id]}</p>`};
const next=()=>{idx++;if(idx>=ORDER.length)return done();const id=ORDER[idx];
if(id===5){view(5,"boom","Em muốn gì cũng được! 🎆");playSFX("victory");try{for(let i=0;i<4;i++)setTimeout(()=>confetti({particleCount:90,spread:100,startVelocity:45,origin:{x:Math.random(),y:.5}}),i*350)}catch(e){}}
else{view(id,"zoom");playSFX("pop")}
tm=setTimeout(next,id===5?4500:3000)};
$("#skip").onclick=done;
view(1,"zoom glow","Món hấp dẫn nhất đây rồi... bấm vào xem nào 👆");playSFX("pop");st.style.cursor="pointer";
tm=setTimeout(next,10000);
st.onclick=()=>{if(idx!==0||clicked)return;clicked=true;clearTimeout(tm);playSFX("troll");
st.className="glass spot shake";st.querySelector(".bigpic").style.filter="grayscale(1) blur(2px)";st.querySelector(".cap").textContent="Đã xảy ra lỗi";
tm=setTimeout(()=>{playSFX("sparkle");view(1,"zoom","Cái này mới đúng nè");st.querySelector(".bigpic").src=IMG.fake;tm=setTimeout(next,3500)},1300)}}
function s3(){if(!S.introDone)return intro();
app.innerHTML=`<div class="step"><h2 class="center" style="font-size:40px">Khu vườn Wishlist 🌷</h2><div class="grid">${GIFTS.map(g=>`<div class="glass card ${S.gift===g.id?"sel":""}" data-id="${g.id}"><div class="ic">${ico(g,"pic")}</div><h3>${g.n}</h3>${TROLL[g.id]?`<div class="err" style="display:${S.tc[g.id]?"block":"none"}">${TROLL[g.id]}</div>`:""}${S.gift===g.id?`<div class="extra">${extra(g.id)}</div>`:""}</div>`).join("")}</div>
<p class="center"><button id="next" ${valid()?"":"disabled"}>Tiếp tục sang bước chốt đơn</button></p></div>`;
document.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.closest(".extra"))return;const id=+c.dataset.id;playSFX("pop");
if(TROLL[id]){S.tc[id]++;playSFX("troll");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");c.querySelector(".err").style.display="block";return}
if(S.gift!==id){S.gift=id;S.f1="";S.f2="";s3()}});
document.querySelectorAll(".extra input,.extra textarea").forEach(el=>el.oninput=()=>{S[el.id]=el.value;$("#next").disabled=!valid()});
$("#next").onclick=()=>{playSFX("pop");go(4)}}
function valid(){return [2,3,5].includes(S.gift)&&S.f1.trim().length>0}
function giftText(){const g=GIFTS.find(x=>x.id===S.gift);return `${g.n}${S.f1?": "+S.f1:""}${S.f2?" ("+S.f2+")":""}`}
function s4(){app.innerHTML=`<div class="step"><div class="receipt" id="rc"><h2>HOÁ ĐƠN THANH TOÁN QUÀ 20/10</h2><hr><p><b>Khách hàng:</b> Công chúa nhỏ</p><p><b>Món quà đã chọn:</b> ${esc(giftText())}</p><p><b>Tổng chi phí:</b> 0 VNĐ (Đã tài trợ 100%)</p><p><b>Thanh toán:</b> 1.000 nụ hôn + 1 cái ôm ấm áp</p><hr><label>Lời nhắn gửi đến nhà tài trợ (Anh người yêu) - bắt buộc:<textarea id="msg" rows="3" placeholder="Viết gì đó cho anh nhé...">${esc(S.msg)}</textarea></label>
<p class="center"><button id="ok" ${S.msg.trim()?"":"disabled"}>XÁC NHẬN CHỐT ĐƠN 💖</button></p></div></div>`;
$("#msg").oninput=e=>{S.msg=e.target.value;$("#ok").disabled=!S.msg.trim()};
$("#ok").onclick=async e=>{const b=e.target;b.disabled=true;b.textContent="Đang gửi... ⏳";playSFX("sparkle");S.msg=$("#msg").value;await send();go(5)}}
async function send(){const g=GIFTS.find(x=>x.id===S.gift);
const payload={timestamp:new Date().toISOString(),selectedGift:g.n,brandOrLink:`${S.f1} ${S.f2}`.trim(),note:S.msg,userBehavior:`Né nút "Hong" ${S.trollDodges} lần; chạm 1 chỉ vàng ${S.tc[1]} lần, Laura ${S.tc[6]} lần, iPhone Duo ${S.tc[7]} lần`};
try{await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})}catch(err){console.warn("Lưu MongoDB lỗi, vẫn tiếp tục:",err)}}
function s5(){const q="“Hạnh phúc là có người để nhớ, có người để thương, và có em để anh mỉm cười mỗi ngày.”";
app.innerHTML=`<div class="step center glass"><h1 style="font-size:48px">Thành công! 🎉</h1><p style="font-size:21px">Hãy đợi món quà đó nhé em 🎁</p><p class="quote">${q}</p><p>Chúc em 20/10 thật hạnh phúc ❤️</p></div>`;
playSFX("victory");try{const end=Date.now()+4000;(function f(){confetti({particleCount:6,angle:60,spread:60,origin:{x:0,y:.7}});confetti({particleCount:6,angle:120,spread:60,origin:{x:1,y:.7}});if(Date.now()<end)requestAnimationFrame(f)})()}catch(e){}}
floaters();render();
</script></body></html>
